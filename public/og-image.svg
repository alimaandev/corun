    <rect x="0" y="10" width="20" height="14" fill="#769826" rx="2"/>
    <rect x="-4" y="8" width="6" height="6" fill="#769826" rx="1"/>
    <rect x="18" y="8" width="6" height="6" fill="#769826" rx="1"/>
