    <rect x="4" y="14" width="4" height="6" fill="#F0EBE3" rx="1"/>
    <rect x="2" y="36" width="4" height="8" fill="#F0EBE3" rx="1"/>
    <rect x="8" y="36" width="4" height="8" fill="#F0EBE3" rx="1"/>
    <!-- Arm -->
