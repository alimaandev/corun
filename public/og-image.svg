    <text x="460" y="450">✦ 52 JavaScript puzzles</text>
    <text x="760" y="450">✦ Procedural soundtrack</text>
    <text x="160" y="475">✦ User-generated content</text>
    <text x="460" y="475">✦ Speed Run &amp; Survival</text>
