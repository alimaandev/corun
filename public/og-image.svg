    <rect x="14" y="12" width="4" height="4" fill="#0a0a0a" rx="1"/>
  </g>

  <!-- Code brackets -->
  <g transform="translate(340, 290)" opacity="0.15">
    <text font-family="monospace" font-size="40" fill="#F0EBE3">&lt;/&gt;</text>
