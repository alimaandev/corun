name: 🐛 Bug Report
description: Report something that isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: input
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      description: Which game mode were you playing?
      options:
        - Gameplay
        - Endless Runner
        - Speed Run
        - Survival
        - Puzzle Editor
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser
      description: e.g. Chrome 120, Firefox 121, Safari 17
  - type: input
    id: device
    attributes:
      label: Device
      description: e.g. Desktop, iPhone 15, Pixel 8
