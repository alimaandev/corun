name: 'Close stale issues'
on:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been inactive for 60 days. Marking as stale.'
          close-issue-message: 'Closed due to inactivity. Feel free to reopen if needed.'
          stale-issue-label: 'stale'
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: 'bug,enhancement,help wanted,good first issue'
